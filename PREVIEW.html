<style>
/* ==========================================================================
   NeoFolks — redesign V8
   Brand: the angular purple M and the fox. One dark palette on every page
   (ink, cream, purple, a touch of mint), a distinct layout per page, built from the same chamfered geometry as the logo.
   ========================================================================== */

:root {
  /* one dark palette for the whole site */
  --ink: #0a0a0a;
  --ink-2: #141414;
  --violet: #b572ec;
  --violet-deep: #2a1a3a;
  --violet-soft: #c99af2;
  --lilac: #241730;
  --bone: #ffffff;
  --ember: #6e3f9c;

  --display: "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --text: "Host Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

  --hh: 72px;
  --pad: clamp(20px, 4.5vw, 72px);
  --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  --cut: 14px;
  --chamfer: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}

/* one colour world, every page */
body[data-page] { --bg: var(--ink); --fg: var(--bone); --muted: rgba(255,255,255,.68); --line: rgba(255,255,255,.16); --accent: var(--violet); --hover: var(--violet); --hover-fg: var(--ink); --grid: rgba(181,114,236,.09); }

/* tones used by cards and panels */
.tone-bone  { --tone: var(--ink-2);        --tone-fg: var(--bone); }
.tone-ink   { --tone: #1b1b1b;            --tone-fg: var(--bone); }
.tone-ember { --tone: var(--ember);       --tone-fg: var(--bone); }
.tone-lilac { --tone: var(--lilac);       --tone-fg: var(--bone); }
.tone-deep  { --tone: var(--violet-deep); --tone-fg: var(--bone); }
.tone-violet{ --tone: var(--violet);      --tone-fg: var(--ink); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; color: var(--fg);
  background: radial-gradient(ellipse 70% 55% at 92% 0%, rgba(181,114,236,.11), transparent 70%) no-repeat, var(--bg);
  font: 400 1rem/1.6 var(--text); -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
img, svg { display: block; max-width: 100%; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
::selection { background: var(--violet); color: var(--ink); }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.h-display {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(1.62rem, 4.64vw, 4.35rem); line-height: 0.92; letter-spacing: -0.035em;
}
.sec { padding: clamp(72px, 11vw, 160px) var(--pad); }

/* fit-text lines stay hidden until sized, so they never flash at the wrong size */
.js [data-fit]:not(.is-fit) { visibility: hidden; }

/* ---- buttons and links ---- */
.btn {
  display: inline-block; padding: 1.05em 1.9em; border: 0; cursor: pointer;
  background: var(--fg); color: var(--bg); font-weight: 600; line-height: 1.1;
  clip-path: var(--chamfer); transition: background .3s, color .3s;
}
.btn:hover { background: var(--hover); color: var(--hover-fg); }
.btn:focus-visible { outline: 2px solid var(--bg); outline-offset: -6px; }
.link {
  display: inline-block; padding-bottom: 3px; font-weight: 600; cursor: pointer; background: none; border: 0;
  background-image: linear-gradient(var(--fg), var(--fg)); background-repeat: no-repeat;
  background-position: 0 100%; background-size: 100% 2px; transition: background-size .3s var(--ease);
}
.link:hover { background-size: 100% 100%; color: var(--bg); }
.slash { display: inline-block; width: 3px; height: 1.5em; background: currentColor; transform: skewX(-20deg); }

/* ==========================================================================
   Header and footer
   ========================================================================== */
.site-header {
  position: sticky; top: 0; z-index: 60; height: var(--hh);
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 0 var(--pad); background: rgba(10,10,10,.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  --cut: 10px; width: 42px; height: 42px; display: grid; place-items: center;
  background: var(--ink-2); clip-path: var(--chamfer);
}
.brand-mark img { width: 30px; height: 30px; object-fit: contain; }
.brand-word { font: 600 1.05rem/1 var(--display); letter-spacing: -0.035em; }

.main-nav { display: flex; align-items: center; gap: clamp(16px, 2.6vw, 38px); font-size: .97rem; }
.main-nav a { position: relative; padding: 6px 0; }
.main-nav a:not(.nav-join)::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: currentColor;
  transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease);
}
.main-nav a:not(.nav-join):hover::after, .main-nav a[aria-current="page"]::after { transform: scaleX(1); }
.nav-join {
  margin-left: 10px; padding: .75em 1.35em !important; font-weight: 600;
  background: transparent; color: var(--fg); border: 1px solid var(--violet); transition: background .3s, color .3s;
}
.nav-join:hover { background: var(--violet); color: var(--ink); }
.menu-btn { display: none; padding: .5em 1.1em; background: none; border: 1.5px solid currentColor; font-weight: 600; cursor: pointer; }

.site-footer { background: var(--ink); color: var(--bone); border-top: 1px solid var(--line); padding: clamp(48px, 7vw, 96px) var(--pad) 0; overflow: hidden; }
.foot-top { display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
.foot-top p { max-width: 28ch; font-size: 1.15rem; line-height: 1.4; }
.foot-links { display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; }
.foot-links a { background-image: linear-gradient(var(--violet), var(--violet)); background-repeat: no-repeat; background-position: 0 100%; background-size: 0 2px; padding-bottom: 3px; transition: background-size .3s var(--ease); }
.foot-links a:hover { background-size: 100% 2px; }
.foot-word { display: flex; align-items: flex-start; margin-top: clamp(40px, 7vw, 100px); overflow: hidden; }
.foot-word > span {
  flex: none; display: block; white-space: nowrap; color: var(--bone);
  font-family: var(--display); font-weight: 600; line-height: .8; letter-spacing: -0.04em; font-size: 12vw;
}
.foot-copy { padding: 18px 0 22px; font-size: .85rem; color: rgba(255,255,255,.55); border-top: 1px solid rgba(255,255,255,.16); }

/* ==========================================================================
   HOME — a poster of three fitted lines, then the orbit
   ========================================================================== */
.hero {
  position: relative; min-height: calc(100svh - var(--hh)); overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(24px, 4vw, 56px) var(--pad) 24px calc(var(--pad) + 34px);
}
.hero-side {
  position: absolute; left: var(--pad); top: 50%; margin: 0; font-size: .85rem; color: var(--muted); letter-spacing: .04em;
  writing-mode: vertical-rl; transform: translateY(-50%) rotate(180deg); white-space: nowrap;
}
.hero-logo { position: absolute; right: -9vw; top: 46%; width: min(72vw, 860px); transform: translateY(-50%); opacity: .13; pointer-events: none; }
.hero-title { position: relative; margin: auto 0; padding: 4vh 0 3vh; }
.hl { display: flex; overflow: hidden; padding-bottom: .03em; }
.hl > span {
  flex: none; display: block; white-space: nowrap; font-family: var(--display); font-weight: 600;
  font-size: 6.4vw; line-height: .95; letter-spacing: -0.035em;
  animation: rise 1s var(--ease) both; animation-delay: calc(var(--i) * .14s + .1s);
}
.hl-outline > span { color: transparent; -webkit-text-stroke: 2px var(--fg); }
@keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
.hero-foot { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
.hero-lede { max-width: 26ch; font-size: clamp(1.2rem, 2vw, 1.65rem); line-height: 1.3; }
.hero-actions { display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
.hero-facts { position: relative; display: flex; flex-wrap: wrap; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .92rem; color: var(--muted); }
.hero-facts li { padding-right: 20px; margin-right: 20px; border-right: 1px solid var(--line); line-height: 1.2; margin-bottom: 6px; }
.hero-facts li:last-child { border: 0; margin-right: 0; }

.intro { display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(32px, 6vw, 100px); align-items: end; }
.intro-side p:first-child { max-width: 30ch; font-size: clamp(1.2rem, 1.8vw, 1.5rem); line-height: 1.35; }
.trio { display: flex; align-items: center; gap: 18px; margin-top: 36px; font: 600 clamp(1.3rem, 2.4vw, 2rem)/1 var(--display); color: var(--accent); }

.orbit-sec { padding: clamp(32px, 6vw, 80px) 0 clamp(72px, 10vw, 140px); border-top: 1px solid var(--line); }
.orbit-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; padding: clamp(40px, 6vw, 80px) var(--pad) 0; }
.orbit-head p { max-width: 24ch; color: var(--muted); font-size: 1.2rem; line-height: 1.4; }
.orbit-stage { position: relative; width: 100%; height: clamp(380px, 54vw, 660px); margin-top: 8px; }
.o-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.o-back { z-index: 1; } .o-front { z-index: 4; }
.orbit-center {
  position: absolute; left: 50%; top: 50%; z-index: 3; width: clamp(96px, 13vw, 150px); aspect-ratio: 1; transform: translate(-50%, -50%);
  display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, rgba(181,114,236,.22), rgba(10,10,10,.96) 70%);
  border: 1px solid rgba(181,114,236,.28); box-shadow: 0 0 60px rgba(181,114,236,.2);
}
.orbit-center img { width: 66%; height: 66%; object-fit: contain; }
.o-node {
  position: absolute; left: 0; top: 0; padding: .62em 1.2em; white-space: nowrap; cursor: pointer; will-change: transform, opacity;
  font: 600 clamp(.85rem, 1.45vw, 1.2rem)/1 var(--text); border-radius: 3px;
  color: color-mix(in srgb, var(--ink) calc(var(--e, 0) * 100%), var(--bone));
  border: 1px solid rgba(181,114,236,calc(.25 + .75 * var(--e, 0)));
  background: color-mix(in srgb, var(--violet) calc(var(--e, 0) * 100%), var(--ink-2));
  box-shadow: 0 0 calc(36px * var(--e, 0)) calc(4px * var(--e, 0)) rgba(181,114,236,calc(.4 * var(--e, 0)));
}
.orbit-foot { display: flex; justify-content: center; margin-top: 36px; }

.next { padding: 0 var(--pad) clamp(72px, 10vw, 140px); }
.ticket {
  --cut: clamp(22px, 3.5vw, 44px); display: grid; grid-template-columns: minmax(240px, .8fr) 1.7fr;
  background: var(--ink-2); color: var(--bone); clip-path: var(--chamfer);
}
.ticket-date { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; padding: clamp(24px, 4vw, 56px); border-right: 2px dashed rgba(255,255,255,.3); }
.t-day { font: 600 clamp(3.77rem, 9.86vw, 8.7rem)/.8 var(--display); color: var(--violet); }
.t-month { display: block; font: 600 1.1rem/1.1 var(--display); }
.t-count { display: inline-block; margin-top: 10px; padding: .35em .8em; background: var(--violet); color: var(--ink); font-size: .9rem; font-weight: 600; }
.ticket-main { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: clamp(24px, 4vw, 56px); }
.ticket-kicker { font-weight: 600; color: var(--violet); }
.ticket-main h2 { font: 600 clamp(1.74rem, 4.64vw, 4.35rem)/.9 var(--display); letter-spacing: -0.035em; margin-top: 8px; }
.ticket-meta { display: flex; gap: 14px; align-items: center; margin-top: 18px; font-weight: 600; }
.ticket-main .t-detail { max-width: 34ch; font-size: 1.15rem; margin-top: 10px; }
.ticket-actions { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.ticket .btn { background: var(--violet); color: var(--ink); }
.ticket .btn:hover { background: var(--bone); color: var(--ink); }

.community { display: grid; grid-template-columns: 1fr 1.25fr; gap: clamp(32px, 6vw, 100px); align-items: start; border-top: 1px solid var(--line); }
.community-copy p { margin-top: 24px; max-width: 22ch; color: var(--muted); font-size: 1.2rem; line-height: 1.4; }
.community-copy .link { margin-top: 32px; }
.c-list li { border-top: 1px solid var(--line); }
.c-list li:first-child { border-top: 0; }
.c-list a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: .12em 0 .08em;
  font: 600 clamp(1.39rem, 3.13vw, 2.9rem)/1.05 var(--display); letter-spacing: -0.035em;
  transition: padding .4s var(--ease), color .3s;
}
.c-list a:hover, .c-list a:focus-visible { padding-left: .25em; color: var(--accent); }
.c-list small { font: 500 .9rem/1 var(--text); color: var(--muted); white-space: nowrap; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.stat { position: relative; padding: clamp(32px, 5vw, 72px) clamp(12px, 3vw, 48px) clamp(32px, 5vw, 72px) var(--pad); }
.stat + .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--line); transform: skewX(-12deg); }
.stat + .stat { padding-left: clamp(16px, 3vw, 48px); }
.stat b { display: block; font: 600 clamp(1.97rem, 8.12vw, 8.12rem)/.85 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.035em; color: var(--accent); }
.stat span { display: block; margin-top: 14px; font-weight: 600; }

.cta {
  --slant: clamp(28px, 7vw, 110px);
  background: var(--ink-2); color: var(--bone); clip-path: polygon(0 var(--slant), 100% 0, 100% 100%, 0 100%);
  padding: calc(var(--slant) + clamp(48px, 8vw, 110px)) var(--pad) clamp(56px, 9vw, 120px);
}
.cta h2 { font: 600 clamp(1.86rem, 6.96vw, 6.38rem)/.88 var(--display); letter-spacing: -0.035em; }
.cta-row { display: flex; justify-content: space-between; align-items: center; gap: 28px; flex-wrap: wrap; margin-top: clamp(28px, 4vw, 56px); }
.cta-row p { font-size: 1.4rem; }
.cta .btn { background: var(--violet); color: var(--ink); }
.cta .btn:hover { background: var(--bone); color: var(--ink); }

/* ==========================================================================
   ABOUT — drafting paper: grid, dimension lines, lanes
   ========================================================================== */
.a-hero {
  padding: clamp(40px, 6vw, 96px) var(--pad) clamp(56px, 8vw, 110px);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px; background-position: -1px -1px;
}
.a-dim { display: flex; align-items: center; gap: 16px; margin-bottom: clamp(28px, 4vw, 56px); color: var(--violet); font-weight: 600; font-size: .95rem; }
.a-dim::before, .a-dim::after { content: ""; flex: 1; height: 16px; background: linear-gradient(currentColor, currentColor) center / 100% 1.5px no-repeat; }
.a-dim::before { border-left: 2px solid currentColor; }
.a-dim::after { border-right: 2px solid currentColor; }
.a-hero h1 { font: 600 clamp(1.8rem, 5.8vw, 5.57rem)/.9 var(--display); letter-spacing: -0.035em; max-width: 12ch; }
.a-lede { max-width: 38ch; margin: clamp(32px, 5vw, 64px) 0 0 auto; font-size: clamp(1.2rem, 1.9vw, 1.55rem); line-height: 1.38; }

.a-do { display: grid; grid-template-columns: minmax(240px, .9fr) 1.8fr; gap: clamp(32px, 6vw, 100px); border-top: 4px solid var(--line); }
.a-do-title { position: sticky; top: calc(var(--hh) + 32px); align-self: start; }
.a-do-title h2 { font: 600 clamp(1.74rem, 4.64vw, 4.06rem)/.88 var(--display); letter-spacing: -0.035em; }
.do-item { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 28px 0 56px; border-top: 4px solid var(--line); transition: border-color .3s; }
.do-item:first-child { border-top: 0; padding-top: 0; }
.do-item:hover { border-color: var(--violet); }
.do-item h3 { font: 600 clamp(1.04rem, 1.86vw, 1.62rem)/1 var(--display); }
.do-item p { max-width: 32ch; font-size: 1.15rem; color: var(--muted); }

.vals { padding-top: 0; }
.vals h2 { max-width: 9ch; }
.vals-row { display: flex; gap: 10px; height: clamp(440px, 50vw, 580px); margin-top: clamp(32px, 5vw, 64px); }
.v-panel {
  position: relative; flex: 1; min-width: 0; overflow: hidden; padding: 22px; text-align: left; cursor: pointer; border: 0;
  background: var(--tone); color: var(--tone-fg); transition: flex .65s var(--ease);
}
.v-panel[aria-expanded="true"] { flex: 6; }
.v-title { position: absolute; top: 20px; left: 22px; font: 600 clamp(1.5rem, 2.6vw, 2.4rem)/1 var(--display); writing-mode: vertical-rl; transition: font-size .5s var(--ease); }
.v-panel[aria-expanded="true"] .v-title { writing-mode: horizontal-tb; font-size: clamp(1.51rem, 3.77vw, 3.48rem); letter-spacing: -0.035em; }
.v-text { position: absolute; left: 22px; bottom: 22px; max-width: 24ch; font-size: 1.25rem; line-height: 1.3; opacity: 0; transform: translateY(14px); transition: opacity .3s, transform .5s var(--ease); }
.v-panel[aria-expanded="true"] .v-text { opacity: 1; transform: none; transition-delay: .25s; }

.lanes { background: var(--ink-2); color: var(--bone); padding: clamp(56px, 8vw, 110px) 0 clamp(48px, 7vw, 96px); }
.lanes-head { padding: 0 var(--pad); margin-bottom: clamp(32px, 5vw, 64px); }
.lanes-head h2 { max-width: 11ch; }
.lane { position: relative; overflow: hidden; border-top: 3px dashed rgba(244,241,251,.35); }
.lane:last-child { border-bottom: 3px dashed rgba(244,241,251,.35); }
.lane-track { display: flex; width: max-content; animation: lane var(--dur, 46s) linear infinite; }
.lane:nth-child(even) .lane-track { animation-direction: reverse; }
.lane:hover .lane-track { animation-play-state: paused; }
.lane-set { display: flex; align-items: center; gap: .45em; padding: .12em .45em .12em 0; font-size: clamp(1.51rem, 4.29vw, 4.06rem); }
.lane-set span { font: 600 1em/1.1 var(--display); text-transform: uppercase; white-space: nowrap;  }
.lane-set .o { color: transparent; -webkit-text-stroke: 2px var(--bone); }
.lane-set span:hover { }
.lane-set i { flex: none; width: 3px; height: .8em; background: var(--violet-soft); transform: skewX(-20deg); }
@keyframes lane { to { transform: translateX(-50%); } }

.mission { padding: clamp(56px, 8vw, 110px) var(--pad) clamp(40px, 6vw, 80px); }
.band {
  --cut: clamp(28px, 4vw, 56px);
  position: sticky; top: calc(var(--hh) + 14px + var(--k) * 16px); min-height: clamp(340px, 58vh, 520px); margin-bottom: 22px;
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; align-items: end; padding: clamp(24px, 4vw, 56px);
  background: var(--tone); color: var(--tone-fg); clip-path: var(--chamfer);
}
.band-tag { align-self: start; grid-column: 1 / -1; font-weight: 600; font-size: .95rem; padding: .4em .9em; width: max-content; background: var(--tone-fg); color: var(--tone); }
.band h2 { font: 600 clamp(1.62rem, 4.35vw, 4.06rem)/.9 var(--display); letter-spacing: -0.035em; }
.band p { max-width: 24ch; font-size: clamp(1.15rem, 1.8vw, 1.5rem); line-height: 1.3; }

.a-cta { padding: clamp(64px, 9vw, 130px) var(--pad); }
.a-cta h2 { font: 600 clamp(1.86rem, 6.38vw, 6.09rem)/.88 var(--display); letter-spacing: -0.035em; color: var(--fg); max-width: 10ch; }
.a-cta .btn { margin-top: clamp(28px, 4vw, 52px); }

/* ==========================================================================
   TEAM — a staggered roster of cut panels on violet
   ========================================================================== */
.t-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; padding: clamp(40px, 6vw, 96px) var(--pad) clamp(32px, 5vw, 64px); }
.t-hero h1 { font: 600 clamp(1.86rem, 6.09vw, 5.8rem)/.88 var(--display); letter-spacing: -0.035em; max-width: 9ch; }
.t-hero p { max-width: 22ch; font-size: 1.3rem; line-height: 1.35; }
.roster { --s: clamp(44px, 6vw, 104px); display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(40px, 6vw, 88px) clamp(20px, 3vw, 48px); padding: 24px var(--pad) calc(var(--s) * 2 + clamp(48px, 6vw, 90px)); }
.m-card:nth-child(3n + 2) { transform: translateY(var(--s)); }
.m-card:nth-child(3n) { transform: translateY(calc(var(--s) * 2)); }
.m-fig {
  --cut: clamp(36px, 5vw, 64px); position: relative; aspect-ratio: 4 / 5; display: grid; place-items: center; overflow: hidden;
  background: var(--tone); color: var(--tone-fg); clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
}

/* ---- formal: hairlines instead of heavy rules, no cut corners, no dashes ---- */
.ticket, .up, .band, .btn, .brand-mark { clip-path: none; }
.cta { clip-path: none; --slant: 0px; }
.m-fig, .m-card:nth-child(3n + 2) .m-fig, .m-card:nth-child(3n) .m-fig { clip-path: none; }
.m-card.is-open .m-fig { background: repeating-linear-gradient(-45deg, #141414 0 18px, #1a1a1a 18px 36px); }
.slash { width: 1px; height: 1.1em; transform: none; }
.stat + .stat::before { width: 1px; transform: none; }
.ticket-date, .up-date { border-right: 1px solid var(--line); }
.lane { border-top: 1px solid rgba(255,255,255,.2); }
.lane:last-child { border-bottom: 1px solid rgba(255,255,255,.2); }
.lane-set .o, .hl-outline > span { -webkit-text-stroke-width: 1px; }
.a-do, .do-item { border-top-width: 1px; }
.filter-bar { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.f-btn, .c-copy { border-width: 1px; }
.f-btn { border-color: var(--line); }
.ev-list { border-top: 1px solid var(--line); }
.ev-row { border-bottom: 1px solid var(--line); }
.c-row { border-top: 1px solid var(--line); }
.c-row:last-child { border-bottom: 1px solid var(--line); }
.c-label, .ticket-kicker { color: var(--muted); }
a.c-value { background-size: 0 2px; }
a.c-value:hover { background-size: 100% 2px; }
.j-in { border-bottom-width: 1px; }
.j-in:focus { background: rgba(255,255,255,.08); }
.tag, .t-count, .band-tag, .j-role { background: transparent; color: inherit; border: 1px solid var(--line); font-weight: 500; }
.band-tag { color: var(--tone-fg); }
.to-top { border-color: rgba(255,255,255,.35); }
.to-top:hover { background: #fff; color: #0a0a0a; }
.btn:hover, .ticket .btn:hover, .cta .btn:hover, .up .btn:hover, .t-bottom .btn:hover, .c-cta .btn:hover {
  background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff;
}
@media (max-width: 960px) {
  .ticket-date, .up-date { border-right: 0; border-bottom: 1px solid var(--line); }
}
.nav-join { font-size: .82rem; }
.hero-logo { filter: grayscale(1); }
@media (max-width: 820px) { .main-nav { gap: 14px; } .main-nav a:not(.nav-join), .nav-join { font-size: .78rem; } .nav-join { padding: .4em .8em !important; } }
</style>

/* NeoFolks site script. Each page registers an initialiser in NF.pages; NF.mount() runs the right one. */
(function () {
  const NF = (window.NF = window.NF || { pages: {} });
  const D = () => window.NEOFOLKS_DATA;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  NF.params = () => new URLSearchParams(NF.preview ? (location.hash.split('?')[1] || '') : location.search);
  NF.page = () => document.body.dataset.page;

  const startOfToday = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
  const toDate = (iso) => new Date(iso + 'T00:00:00');
  const daysTo = (d) => Math.round((d - startOfToday()) / 864e5);
  const countText = (d) => {
    const n = daysTo(d);
    return n === 0 ? 'Happening today' : n === 1 ? 'Tomorrow' : n > 1 ? n + ' days to go' : '';
  };
  const pad = (n) => String(n).padStart(2, '0');

  /* ---- fit text: scales a single line so it spans its container exactly ---- */
  NF.fit = function () {
    document.querySelectorAll('[data-fit]').forEach((el) => {
      const box = el.parentElement;
      el.style.fontSize = '100px';
      const w = el.getBoundingClientRect().width;
      const cw = box.clientWidth;
      const narrow = innerWidth < 700;
      const cap = el.closest('.foot-word') ? (narrow ? 0.5 : 0.36) : (narrow ? 0.68 : 0.4);
      if (w && cw) el.style.fontSize = Math.floor((100 * cw * cap / w) * 10) / 10 + 'px';
      el.classList.add('is-fit');
    });
  };

  /* ---- shell: header, mobile menu (runs once) ---- */
  let shellDone = false;
  NF.shell = function () {
    if (shellDone) return; shellDone = true;
    const btn = document.querySelector('.menu-btn');
    const setMenu = (open) => {
      document.body.classList.toggle('menu-open', open);
      if (btn) { btn.setAttribute('aria-expanded', String(open)); btn.textContent = open ? 'Close' : 'Menu'; }
    };
    btn?.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
    document.querySelector('.main-nav')?.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });
    addEventListener('resize', NF.fit, { passive: true });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(NF.fit);
  };

  NF.mount = function () {
    const page = NF.page();
    document.querySelectorAll('.main-nav a[data-nav]').forEach((a) => {
      if (a.dataset.nav === page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    NF.fit();
    (NF.pages[page] || function () {})();
    if (NF.scroll) NF.scroll();
  };

  /* ---------- HOME ---------- */
  NF.pages.home = function () {
    NF.orbit && NF.orbit();

    // next event
    const ev = D().events.map((e) => ({ ...e, d: toDate(e.iso) }));
    const up = ev.filter((e) => e.d >= startOfToday()).sort((a, b) => a.d - b.d)[0];
    const next = up || ev.sort((a, b) => b.d - a.d)[0];
    const t = document.getElementById('nextTicket');
    if (t && next) {
      t.querySelector('[data-day]').textContent = pad(next.d.getDate());
      t.querySelector('[data-month]').textContent = MONTHS_LONG[next.d.getMonth()] + ' ' + next.d.getFullYear();
      t.querySelector('[data-count]').textContent = up ? countText(next.d) : 'Past event';
      t.querySelector('[data-kicker]').textContent = up ? 'Next up' : 'Latest event';
      t.querySelector('[data-title]').textContent = next.title;
      t.querySelector('[data-cat]').textContent = D().catLabels[next.cat];
      t.querySelector('[data-detail]').textContent = next.detail;
    }

    // community word list shows how many events each holds
    document.querySelectorAll('[data-count-cat]').forEach((el) => {
      const n = D().events.filter((e) => e.cat === el.dataset.countCat).length;
      el.textContent = n === 0 ? 'Soon' : n + (n === 1 ? ' event' : ' events');
    });

    // stats count up once, when they scroll into view
    const stats = document.querySelectorAll('[data-stat]');
    const run = (el) => {
      const end = +el.dataset.stat, suf = el.dataset.suffix || '';
      if (reduce) { el.textContent = end + suf; return; }
      const t0 = performance.now(), dur = 1400;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(end * e) + (p === 1 ? suf : '');
        if (p < 1 && el.isConnected) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((en) => en.forEach((x) => { if (x.isIntersecting) { run(x.target); io.unobserve(x.target); } }), { threshold: 0.6 });
      stats.forEach((s) => { s.textContent = '0'; io.observe(s); });
    } else stats.forEach(run);
  };

  /* ---------- ABOUT ---------- */
  NF.pages.about = function () {
    const panels = [...document.querySelectorAll('.v-panel')];
    panels.forEach((p) => p.addEventListener('click', () => {
      panels.forEach((q) => q.setAttribute('aria-expanded', String(q === p)));
    }));
  };

  /* ---------- TEAM ---------- */
  NF.pages.team = function () {
    const root = document.getElementById('roster');
    if (!root) return;

      const fig = m.photo
        ? `<img class="m-photo" src="${m.photo}" alt="${m.name}">`
        : `<span class="m-mono" aria-hidden="true">${m.initials}</span>`;
      const apply = m.open ? `<a class="link m-apply" href="join.html?role=event-operations">Apply</a>` : '';
      return `<article class="m-card tone-${m.tone}${m.open ? ' is-open' : ''}">
        <div class="m-fig">${fig}</div>
        <h3 class="m-name">${m.name}</h3>
        <p class="m-role">${m.role}</p>${apply}</article>`;
    }).join('');
  };

  /* ---------- EVENTS ---------- */
  NF.pages.events = function () {
    const app = document.getElementById('eventsApp');
    if (!app) return;
    const labels = D().catLabels;
    const today = startOfToday();
    const all = D().events.map((e) => ({ ...e, d: toDate(e.iso) }));
    const upcoming = all.filter((e) => e.d >= today).sort((a, b) => a.d - b.d);
    const past = all.filter((e) => e.d < today).sort((a, b) => b.d - a.d);
    const cats = ['all', 'workshops', 'seminars', 'competitions', 'community'];
    let filter = NF.params().get('filter');
    if (!cats.includes(filter)) filter = 'all';
    const count = (c) => all.filter((e) => c === 'all' || e.cat === c).length;
    const bar = document.getElementById('filterBar');
    const out = document.getElementById('eventsOut');

    const upCard = (e) => `<article class="up">
      <div class="up-date"><b>${pad(e.d.getDate())}</b><span>${MONTHS[e.d.getMonth()]} ${e.d.getFullYear()}</span></div>
      <div class="up-body"><p class="tag">${labels[e.cat]}</p><h3>${e.title}</h3><p>${e.detail}</p>
      <p class="up-count">${countText(e.d)}</p><a class="btn" href="join.html">Join NeoFolks</a></div></article>`;
    const row = (e) => `<li class="ev-row">
      <div class="ev-date"><b>${pad(e.d.getDate())}</b><span>${MONTHS[e.d.getMonth()]} ${e.d.getFullYear()}</span></div>
      <h3 class="ev-title">${e.title}</h3><p class="ev-cat">${labels[e.cat]}</p><p class="ev-detail">${e.detail}</p></li>`;

    function render() {
      bar.innerHTML = cats.map((c) => `<button type="button" class="f-btn" aria-pressed="${c === filter}" data-f="${c}">${c === 'all' ? 'All' : labels[c]}<sup>${count(c)}</sup></button>`).join('');
      const u = upcoming.filter((e) => filter === 'all' || e.cat === filter);
      const p = past.filter((e) => filter === 'all' || e.cat === filter);
      let html = '';
      if (u.length) html += `<section class="ev-block" id="upcoming"><h2 class="ev-h">Upcoming</h2>${u.map(upCard).join('')}</section>`;
      if (p.length) html += `<section class="ev-block"><h2 class="ev-h">Past</h2><ul class="ev-list">${p.map(row).join('')}</ul></section>`;
      if (!u.length && !p.length) html = `<div class="ev-empty"><h2>Nothing listed under ${labels[filter]} yet.</h2><p>Have an idea for one? Tell us and we will help you run it.</p><a class="btn" href="contact.html">Suggest an event</a></div>`;
      out.innerHTML = html;
    }
    bar.addEventListener('click', (e) => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      filter = b.dataset.f; render();
    });
    render();
  };

  /* ---------- CONTACT ---------- */
  NF.pages.contact = function () {
    const btn = document.getElementById('copyEmail');
    if (!btn) return;
    const email = btn.dataset.email;
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(email); }
      catch (e) { const t = document.createElement('textarea'); t.value = email; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (x) {} t.remove(); }
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy email'; }, 2000);
    });
  };

  /* ---------- JOIN ---------- */
  NF.pages.join = function () {
    const form = document.getElementById('joinForm');
    if (!form) return;
    const done = document.getElementById('joinDone');
    const role = NF.params().get('role');
    if (role === 'event-operations') {
      const note = document.getElementById('roleNote');
      if (note) { note.hidden = false; }
      const sel = form.elements.interest; if (sel) sel.value = 'Other';
    }

        'Year: ' + d.year, 'Interested in: ' + d.interest,
        role === 'event-operations' ? 'Applying for: Event Operations Lead' : ''
      ].filter(Boolean).join('\n');
      const href = 'mailto:neofolks@nuvstudents.edu?subject=' + encodeURIComponent('Join NeoFolks: ' + d.name) + '&body=' + encodeURIComponent(lines);
      /* No backend yet: the form opens a ready-to-send email. Replace with a fetch() to your API later. */
      done.querySelector('[data-name]').textContent = d.name.split(' ')[0];
      done.querySelector('[data-mail]').setAttribute('href', href);
      form.hidden = true; done.hidden = false; done.focus();
      location.href = href;
    });
    done.querySelector('[data-back]')?.addEventListener('click', () => { done.hidden = true; form.hidden = false; form.elements.name.focus(); });
  };


  /* ---- scroll features: progress bar, back-to-top, reveal, word scrub, hero parallax ---- */
  let scrollBound = false, bar, topBtn, scrubs = [], revealIO;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  NF.scroll = function () {
    if (!scrollBound) {
      scrollBound = true;
      bar = document.createElement('div'); bar.className = 'scroll-bar'; bar.setAttribute('aria-hidden', 'true'); document.body.appendChild(bar);
      topBtn = document.createElement('button'); topBtn.type = 'button'; topBtn.className = 'to-top'; topBtn.textContent = 'Top'; topBtn.setAttribute('aria-label', 'Back to top');
      topBtn.addEventListener('click', () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));
      document.body.appendChild(topBtn);
      let ticking = false;
      const onScroll = () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; NF.scrollTick(); }); };
      addEventListener('scroll', onScroll, { passive: true });

    if (revealIO) revealIO.disconnect();
    if (!reduce && 'IntersectionObserver' in window) {
      revealIO = new IntersectionObserver((en) => en.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
      const groups = [
        ['.intro > *, .community > *, .orbit-head, .next .ticket, .stat, .cta h2, .cta-row', 'rv'],
        ['.a-hero .a-lede, .do-item, .a-do-title, .vals h2, .vals-row, .lanes-head, .a-cta > *', 'rv'],
        ['.t-hero > *, .t-bottom > *', 'rv'],
        ['.m-card', 'rv-fade'],
        ['.e-hero p, .up, .ev-row, .e-cta > *', 'rv'],
        ['.c-row, .c-cta > *', 'rv'],
        ['.j-side > p, .j-words', 'rv']

      groups.forEach(([sel, cls]) => document.querySelectorAll(sel).forEach((el, i) => {
        if (el.classList.contains('rv') || el.classList.contains('rv-fade')) return;
        el.classList.add(cls); el.style.setProperty('--d', Math.min(i % 4, 3) * 0.07 + 's'); revealIO.observe(el);
      }));
    }
    // word scrub: words light up as the paragraph scrolls into view
    scrubs = [];
    if (!reduce) document.querySelectorAll('.a-lede, .intro-side > p:first-child').forEach((el) => {
      if (el.dataset.scrub) return; el.dataset.scrub = '1';
      const words = el.textContent.trim().split(/\s+/);
      el.setAttribute('aria-label', words.join(' '));

    document.querySelectorAll('.a-lede, .intro-side > p:first-child').forEach((el) => { if (!scrubs.includes(el) && el.dataset.scrub) scrubs.push(el); });
    NF.scrollTick();
  };
  NF.scrollTick = function () {
    const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    if (bar) bar.style.transform = 'scaleX(' + (h > 0 ? clamp01(y / h) : 0).toFixed(4) + ')';
    if (topBtn) topBtn.classList.toggle('show', y > innerHeight * 0.9);
    const logo = document.querySelector('.hero-logo');
    if (logo && !reduce) logo.style.setProperty('--py', Math.min(y, 900) * 0.18 + 'px');

  }
})();

people who like to <em class=\"pu\">build.</em></h1>\n  <p class=\"a-lede\">NeoFolks is the technology community at Navrachana University, Vadodara &mdash; bringing students together through learning, experimentation and collaboration.</p>\n</section>\n\n<section class=\"a-do sec\">\n  <div class=\"a-do-title\"><h2>Learn.<br>Build.<br><em class=\"pu\">Share.</em></h2></div>\n  <div class=\"do-list\">\n    <article class=\"do-item\"><h3>Technical Workshops</h3><p>Hands-on sessions across web development, AI/ML, cloud computing and emerging technologies.</p></article>\n    <article class=\"do-item\"><h3>Community Building</h3><p>A supportive network of students who learn, grow and innovate together.</p></article>\n    <article class=\"do-item\"><h3>Tech Events</h3><p>Hackathons, tech talks, coding competitions and industry sessions.</p></article>\n    <article class=\"do-item\"><h3>Mentorship</h3><p>Guidance from peers and industry professionals.</p></article>\n  </div>\n</section>\n\n<section class=\"vals sec\">\n  <h2 class=\"h-display\">Built on <em class=\"pu\">curiosity.</em></h2>\n  <div class=\"vals-row\">\n    <button type=\"button\" class=\"v-panel tone-violet\" aria-expanded=\"true\"><span class=\"v-title\">Innovation</span><span class=\"v-text\">Explore what is possible.</span></button>\n    <button type=\"button\" class=\"v-panel tone-ink\" aria-expanded=\"false\"><span class=\"v-title\">Collaboration</span><span class=\"v-text\">Build better together.</span></button>\n    <button type=\"button\" class=\"v-panel tone-lilac\" aria-expanded=\"false\"><span class=\"v-title\">Learning</span><span class=\"v-text\">Keep growing.</span></button>\n    <button type=\"button\" class=\"v-panel tone-ember\" aria-expanded=\"false\"><span class=\"v-title\">Inclusivity</span><span class=\"v-text\">Everyone gets to learn.</span></button>\n  </div>\n</section>\n\n<section class=\"lanes\" aria-labelledby=\"lanesH\">\n  <div class=\"lanes-head\"><h2 class=\"h-display\" id=\"
